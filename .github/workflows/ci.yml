name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validator-tests:
    name: Validator tests + fixture pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: validator/pyproject.toml

      - name: Install validator
        working-directory: validator
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit + fixture tests
        working-directory: validator
        run: pytest tests/ -v --tb=short

      - name: Check the API contract (version, profiles, string ids, examples against schemas)
        run: python3 bin/check-contract.py

      - name: Verify schemas are valid JSON Schema 2020-12
        run: |
          python -c "
          import json, pathlib, sys
          from jsonschema import Draft202012Validator
          errors = 0
          for p in pathlib.Path('schemas').glob('*.schema.json'):
              try:
                  Draft202012Validator.check_schema(json.loads(p.read_text()))
                  print(f'  ✓ {p.name}')
              except Exception as e:
                  print(f'  ✗ {p.name}: {e}')
                  errors += 1
          sys.exit(1 if errors else 0)
          "

      - name: Verify SHACL shapes parse as Turtle
        run: |
          pip install rdflib
          python -c "
          import pathlib, sys
          from rdflib import Graph
          errors = 0
          for p in pathlib.Path('shapes').glob('*.shacl.ttl'):
              try:
                  g = Graph()
                  g.parse(str(p), format='turtle')
                  print(f'  ✓ {p.name} ({len(g)} triples)')
              except Exception as e:
                  print(f'  ✗ {p.name}: {e}')
                  errors += 1
          sys.exit(1 if errors else 0)
          "

      - name: Check every openric and openricx term in use is defined and bound
        run: python bin/check-vocab.py

  site-links:
    name: Spec site link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check internal Markdown links resolve
        run: python3 bin/check-links.py

      - name: Check version claims agree with version.json
        run: python3 bin/check-versions.py

  scenario-validation:
    name: Wizard scenario library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate modelling-wizard scenarios
        run: node bin/validate-scenarios.mjs

  site-build:
    # The full Jekyll build, with the same builder GitHub Pages uses, so a
    # Liquid or plugin error fails here on the pull request instead of first
    # appearing as a broken Pages deployment of main.
    name: Full site build (GitHub Pages builder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Key pages exist in the build
        run: |
          for f in index.html status/index.html application/index.html spec/index.html spec/versions/index.html proof.html sitemap.xml release.json .well-known/security.txt; do
            test -s "_site/$f" || { echo "missing from build: $f"; exit 1; }
          done

      # Accessibility smoke test (plan V4, S3): axe at WCAG 2 A and AA on the
      # pages in bin/a11y-pages.txt, in the runner's own Chrome. A smoke test,
      # not an audit - the full WCAG 2.2 AA audit of the graph viewer and
      # wizard is separate work (known issue K-11).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Accessibility smoke test (axe, WCAG 2 AA)
        run: |
          npm install --no-save --no-audit --no-fund puppeteer-core@23.11.1 axe-core@4.10.2
          (cd _site && python3 -m http.server 4000 --bind 127.0.0.1 >/dev/null 2>&1 &)
          for i in $(seq 1 15); do curl -sf http://localhost:4000/ >/dev/null && break; sleep 1; done
          CHROME="$(command -v google-chrome)" node bin/check-a11y.cjs http://localhost:4000

      - name: Keep the built site for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7

  minimal-server:
    # The implementer quick-start, proven on every change: a standard-library
    # server with its own data and identifiers (no Heratio, no production
    # service) must validate against the JSON Schemas and pass the conformance
    # probe for Core Discovery. Runs entirely inside the CI runner.
    name: Minimal server passes Core Discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the schema validator library
        run: python -m pip install --quiet jsonschema

      - name: Start the minimal server
        run: |
          PORT=8080 python examples/minimal-server/server.py &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health >/dev/null && exit 0; sleep 1; done
          echo "server did not start"; exit 1

      - name: Responses validate against the JSON Schemas
        run: BASE=http://localhost:8080 python examples/minimal-server/check.py

      - name: Conformance probe passes Core Discovery
        run: |
          BASE=http://localhost:8080 KEY="" bash conformance/probe.sh --profile=core-discovery --json=probe.json
          jq -e '.verdict == "pass"' probe.json
